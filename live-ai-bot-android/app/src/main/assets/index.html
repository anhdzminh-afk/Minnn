<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LIVE AI BOT</title><style>body{font-family:system-ui;background:#101827;color:white;padding:24px}input,button{font:inherit;padding:14px;border-radius:12px;margin:8px 0;width:100%;box-sizing:border-box}button{background:#24d3b3;border:0}small{color:#c9d3df}article{background:#202d40;padding:16px;border-radius:16px}</style></head><body><h2>LIVE AI BOT Android</h2><article><p>Chế độ an toàn: bản thử nghiệm, chưa kết nối TikTok LIVE thật.</p><label>Tên chủ phòng LIVE</label><input id="room" placeholder="@tenchuphong"><button onclick="demo()">Tạo bình luận thử</button><p id="output">Chưa có dữ liệu</p><button onclick="navigator.clipboard?.writeText(document.getElementById('output').textContent)">Sao chép</button><small>Để tự đọc và gửi bình luận LIVE thật cần máy chủ, AI và quyền gửi chat hợp lệ. Không nhập mật khẩu hoặc cookie TikTok.</small></article><script>function demo(){let room=document.getElementById('room').value.trim()||'chủ phòng';document.getElementById('output').textContent='Chào '+room+', nội dung LIVE hôm nay rất thú vị!';}</script></body></html>
